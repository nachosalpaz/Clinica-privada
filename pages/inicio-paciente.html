<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar Sesión - Paciente</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style/iniciar-sesion.css">
    <link rel="stylesheet" href="../style/styles.css">
</head>

<body>

    <main class="login-container">

        <div class="login-box">

            <h1>Bienvenido</h1>

            <p class="subtitulo">
                Ingresá a tu cuenta de MediTurnos
            </p>


            <div class="tipo-usuario">

                <a href="./iniciar-sesion-paciente.html"
                   class="tipo activo">

                    <img src="../assets/img.iniciar-sesion/icono-paciente.png" class="paciente-img">

                    Paciente

                </a>


                <a href="./inicio-profesional.html"
                   class="tipo">

                    <img src="../assets/img.iniciar-sesion/icono-profesional.png" class="profesional-img">

                    Profesional

                </a>

            </div>


            <form>

                <div class="mb-3">

                    <label for="usuario" class="form-label">
                        USUARIO O CORREO ELECTRÓNICO
                    </label>

                    <input
                        type="text"
                        id="usuario"
                        class="form-control"
                        placeholder="usuario@email.com"
                    >

                </div>


                <div class="mb-2">

                    <label for="password" class="form-label">
                        CONTRASEÑA
                    </label>

                    <input
                        type="password"
                        id="password"
                        class="form-control"
                        placeholder="••••••••"
                    >

                </div>


                <div class="recuperar">

                    <a href="#">
                        ¿Olvidaste tu contraseña?
                    </a>

                </div>


                <button type="submit" class="btn iniciar">
                    Iniciar Sesión
                </button>


                <a href="#" class="btn google">

                    <img src="../assets/img.iniciar-sesion/icono-google.png" class="google-img">

                    Continuar con Google

                </a>

            </form>


            <p class="registro">

                ¿No tenés una cuenta?

                <a href="registro.html">
                    Registrarse gratis
                </a>

            </p>

        </div>

    </main>

</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</html>
